name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dev tooling
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit and integration tests
        run: bun test
      - name: Build bundle
        run: bun run build
      - name: Package install smoke
        run: bun run smoke:install
      - name: Patch reliability experiment
        run: bun experiments/patch-bench.ts
      - name: Audit integrity experiment
        run: bun experiments/audit-bench.ts
      - name: Effects performance experiment
        run: bun experiments/effects-bench.ts
      - name: Tool schema overhead experiment
        run: bun experiments/tool-overhead-bench.ts
      - name: Artifact crash experiment
        run: bun experiments/kill9-artifacts.ts
      - name: Audit anchor crash experiment
        run: bun experiments/kill9-audit-anchor.ts
      - name: Budget restart experiment
        run: bun experiments/kill9-budget.ts
