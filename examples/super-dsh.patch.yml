# Load SuperDSH from a local build as a startup overlay.
# Replace <ABSOLUTE_PATH> with the absolute path to dist/index.js.
- insert:
    - id: super-dsh
      name: '<ABSOLUTE_PATH>/dist/index.js'
      config:
        fuzzyEdit: true
        applyPatch:
          maxFiles: 10
          useLocks: true
          lockTimeoutMs: 5000
        memory: true
        repairs: true        # opt-in: adds 3 tools and automatic hints
        # Opt-in destructive retention:
        # retention:
        #   maxAgeDays: 30
        #   deleteSource: false
        notes: true
        repoMap: true
        knowledge: true
        effects:
          denyUnresolvedIrreversible: false
        artifacts: true
        audit: true
        handoff: true
        historyCompact: true
        reflection: true
        replayPlan: true
        # Opt-in:
        # audit:
        #   signingKeyEnv: 'SUPER_DSH_AUDIT_KEY'
        # budget:
        #   maxTokens: 200000
        #   enforce: false
        #   reservePerRequest: 0
        # verify:
        #   command: 'bun test'
        #   timeoutMs: 120000
        #   maxAttempts: 2

# Avoid an extra title-generation model request in scripted runs.
- id: session-title-llm
  disabled: true
