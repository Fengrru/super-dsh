# Load SuperDSH from a local build as a startup overlay.
# Replace <ABSOLUTE_PATH> with the absolute path to dist/index.js.
- insert:
    - id: super-dsh
      name: '<ABSOLUTE_PATH>/dist/index.js'
      config:
        fuzzyEdit: true
        applyPatch:
          maxFiles: 10
        memory: true
        notes: true
        repoMap: true
        knowledge: true
        effects: true
        artifacts: true
        audit: true
        handoff: true
        historyCompact: true
        reflection: true
        # These are opt-in:
        # budget:
        #   maxTokens: 200000
        #   enforce: false
        # verify:
        #   command: 'bun test'
        #   timeoutMs: 120000
        #   maxAttempts: 2

# Avoid an extra title-generation model request in scripted runs.
- id: session-title-llm
  disabled: true
